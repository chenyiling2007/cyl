<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>陈屹凌 · AI 应用探索者</title>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com"></script>
<style>
/* ============ 个性创意风 · 暖色调主题（配合 Tailwind 使用） ============ */
:root{
  --ink:#3D3229;
  --sub:#8A7A6D;
  --coral:#FF7E5F;
  --peach:#FFB88C;
  --yellow:#FFC94D;
  --green:#7FB685;
}
html{scroll-behavior:smooth}
body{
  font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;
  background:#FFF9F2;color:var(--ink);line-height:1.75;
}
a{color:inherit;text-decoration:none}

/* ---------- 全局滚动进度条（cyan → emerald 渐变，按需求） ---------- */
#progress{
  position:fixed;top:0;left:0;height:4px;width:0%;z-index:200;
  background:linear-gradient(90deg,#22d3ee,#34d399);
  transition:width .08s linear;
}

/* ---------- 导航 ---------- */
nav{
  position:fixed;top:4px;left:0;right:0;z-index:100;
  display:flex;justify-content:space-between;align-items:center;
  padding:14px 6vw;
  background:rgba(255,249,242,.85);backdrop-filter:blur(10px);
  border-bottom:1px solid rgba(255,126,95,.15);
}
nav .logo{font-weight:800;font-size:1.15rem;color:var(--coral)}
nav .links{display:flex;gap:22px;font-size:.92rem;flex-wrap:wrap}
nav .links a{color:var(--sub);transition:.25s}
nav .links a:hover{color:var(--coral)}

/* ---------- 首屏 ---------- */
.hero{
  position:relative;min-height:100vh;
  display:flex;align-items:center;justify-content:center;
  gap:5vw;padding:120px 6vw 80px;flex-wrap:wrap;text-align:left;
  background:url("assets/hero-bg.jpg") center/cover no-repeat;
}
/* 深色渐变蒙版：压暗背景、突出内容 */
.hero::before{
  content:"";position:absolute;inset:0;
  background:linear-gradient(125deg, rgba(40,28,22,.34) 0%, rgba(40,28,22,.14) 45%, rgba(40,28,22,.26) 100%);
}
.hero > *{position:relative;z-index:1}

/* 左侧个人信息卡（毛玻璃） */
.hero .info-card{
  background:rgba(255,255,255,.14);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border:1px solid rgba(255,255,255,.28);
  border-radius:28px;padding:38px 36px;
  box-shadow:0 20px 60px rgba(0,0,0,.25);
  max-width:420px;flex:1 1 320px;transition:transform .4s;
}
.hero .info-card:hover{transform:translateY(-8px)}
/* 名字 + 头像同行 */
.name-row{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:14px}
.hero .avatar{
  width:148px;height:148px;border-radius:28px;object-fit:cover;
  box-shadow:0 10px 30px rgba(0,0,0,.35);
  border:3px solid #fff;flex-shrink:0;transform:rotate(3deg);
}
.hero h1{
  font-size:clamp(2rem,4.5vw,2.8rem);letter-spacing:.04em;line-height:1.1;
  color:#FFF3E0;font-weight:800;text-shadow:0 2px 14px rgba(0,0,0,.35);
}
.hero .tag{
  display:inline-block;margin:14px 0 6px;padding:6px 18px;border-radius:999px;
  background:linear-gradient(90deg,var(--coral),var(--peach));color:#fff;
  font-weight:700;font-size:1rem;
}
.hero .sub{color:rgba(255,243,224,.92);font-size:1rem;margin-bottom:16px}

/* 打字机（呼吸闪烁光标，带金色「」边框装饰） */
.typeline{
  height:1.9em;font-size:1.1rem;font-weight:700;color:#FFDD8A;
  text-shadow:0 1px 10px rgba(0,0,0,.3);margin-top:34px;
}
.typeline::before{content:"「 ";color:#FFC94D}
.typeline::after{content:" 」";color:#FFC94D}
.typeline .cursor{
  display:inline-block;width:2px;height:1.15em;margin-left:3px;
  background:#FFDD8A;vertical-align:-2px;
  animation:blink 1s steps(1) infinite;
}
@keyframes blink{50%{opacity:0}}

.btn{
  padding:11px 24px;border-radius:999px;font-weight:700;font-size:.92rem;
  transition:.25s;display:inline-flex;align-items:center;gap:8px;
  cursor:pointer;border:none;
}
.btn.primary{background:#fff;color:var(--ink)}
.btn.primary:hover{background:var(--coral);color:#fff;transform:translateY(-3px)}
.btn.ghost{border:2px solid rgba(255,255,255,.8);color:#fff;background:transparent}
.btn.ghost:hover{background:#fff;color:var(--ink);transform:translateY(-3px)}
.quote-line{
  margin-top:26px;font-size:1.1rem;font-weight:600;color:#FFDD8A;
  text-shadow:0 1px 10px rgba(0,0,0,.3);min-height:1.8em;
}
.quote-line::before{content:"「 "}.quote-line::after{content:" 」"}

/* 右侧网站列表卡片格 */
.nav-grid{flex:1 1 460px;max-width:560px;display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.nav-card{
  background:rgba(255,255,255,.14);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border:1px solid rgba(255,255,255,.28);border-radius:22px;
  padding:30px 16px;text-align:center;color:#fff;
  box-shadow:0 12px 34px rgba(0,0,0,.22);
  transition:all .35s cubic-bezier(.2,.7,.3,1);cursor:pointer;overflow:hidden;
  display:flex;flex-direction:column;justify-content:center;align-items:center;
}
.nav-card:hover{
  transform:translateY(-8px) scale(1.04);
  background:rgba(255,255,255,.24);
  box-shadow:0 22px 50px rgba(0,0,0,.35);
}
.nav-card .name{font-weight:700;font-size:1.08rem;display:block;line-height:1.4}
.nav-card .en{
  display:block;margin-top:8px;font-size:.76rem;letter-spacing:.12em;font-weight:600;
  color:#FFE1A6;text-transform:uppercase;text-shadow:0 1px 8px rgba(0,0,0,.35);
}
.nav-card.soon{
  background:rgba(255,255,255,.08);
  border:2px dashed rgba(255,255,255,.4);cursor:default;
}
.nav-card.soon:hover{transform:none;background:rgba(255,255,255,.08);box-shadow:0 12px 34px rgba(0,0,0,.22)}

/* ---------- 通用区块 ---------- */
section{max-width:1060px;margin:0 auto;padding:90px 6vw 10px}
.sec-head{display:flex;align-items:baseline;gap:14px;margin-bottom:38px}
.sec-head .num{font-size:2.4rem;font-weight:800;color:transparent;-webkit-text-stroke:1.6px var(--coral);font-family:Georgia,serif}
.sec-head h2{font-size:1.7rem;letter-spacing:.06em}
.sec-head .line{flex:1;height:1px;background:linear-gradient(90deg,rgba(255,126,95,.4),transparent)}

/* 关于我：一条主线，五步阅读（纵向主轴 + 编号节点引导视线） */
.about-flow{position:relative;padding-left:44px}
.about-flow::before{
  content:"";position:absolute;left:13px;top:14px;bottom:14px;width:3px;
  background:linear-gradient(180deg,var(--coral),var(--yellow),var(--green));border-radius:3px;
  /* 竖线随滚动缓缓“生长”：--grow 由 JS 驱动，默认 1（无 JS 时完整显示） */
  transform:scaleY(var(--grow,1));transform-origin:top;
}
.a-step{position:relative;margin-bottom:52px}
.a-step::before{
  content:attr(data-step);position:absolute;left:-44px;top:0;
  width:30px;height:30px;border-radius:50%;
  background:#fff;border:3px solid var(--coral);
  font-size:.68rem;font-weight:800;color:var(--coral);
  display:flex;align-items:center;justify-content:center;letter-spacing:.02em;
}
.a-step:nth-child(2)::before{border-color:var(--peach);color:var(--peach)}
.a-step:nth-child(3)::before{border-color:var(--yellow);color:#C79A1F}
.a-step:nth-child(4)::before{border-color:var(--green);color:var(--green)}
.a-step:nth-child(5)::before{border-color:var(--coral);color:var(--coral)}

/* 第 1 步：观点大标题（全版唯一最大锚点） */
.a-title{font-size:clamp(1.7rem,4vw,2.5rem);font-weight:800;line-height:1.25;color:var(--ink)}
.a-subtitle{margin-top:10px;color:var(--sub);font-size:1.05rem}

/* 第 2 步：事实速览条（单行横排，从左扫到右） */
.fact-strip{
  display:flex;gap:0;flex-wrap:wrap;
  background:#fff;border-radius:18px;
  box-shadow:0 8px 28px rgba(255,126,95,.12);overflow:hidden;
}
.fact-item{flex:1 1 160px;padding:18px 22px;border-left:3px solid rgba(255,126,95,.25)}
.fact-item:first-child{border-left:none}
.fact-item .label{font-size:.7rem;font-weight:800;letter-spacing:.14em;color:var(--coral)}
.fact-item .value{margin-top:4px;font-weight:700;font-size:1rem;color:var(--ink)}

/* 第 3 步：成长路径（横向 3 节点，移动端纵向） */
.path-row{display:flex;gap:14px;flex-wrap:wrap}
.path-node{
  flex:1 1 180px;background:#fff;border-radius:18px;padding:20px 18px;
  box-shadow:0 8px 28px rgba(255,126,95,.12);position:relative;
  border-top:4px solid var(--yellow);
}
.path-node:first-child{border-top-color:var(--peach)}
.path-node:last-child{border-top-color:var(--green)}
.path-node h4{font-size:1.02rem;font-weight:700}
.path-node p{margin-top:6px;font-size:.88rem;color:var(--sub)}
.path-arrow{
  align-self:center;color:var(--coral);font-weight:800;font-size:1.3rem;flex-shrink:0;
}

/* 第 4 步：做事方式标签（一行胶囊） */
.style-tags{display:flex;gap:12px;flex-wrap:wrap}
.style-chip{
  padding:10px 22px;border-radius:999px;font-weight:700;font-size:.94rem;
  background:rgba(255,126,95,.1);color:var(--coral);border:1.5px solid rgba(255,126,95,.35);
  transition:.3s;
}
.style-chip:hover{background:var(--coral);color:#fff;transform:translateY(-3px)}

/* 第 5 步：格言收尾（大字号引用，视觉终点） */
.a-quote{
  font-size:clamp(1.5rem,3.6vw,2.2rem);font-weight:800;line-height:1.5;
  background:linear-gradient(90deg,var(--coral),var(--yellow));
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.a-quote::before{content:"「 "}.a-quote::after{content:" 」"}

/* 技能卡片 */
.skills-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px}
.skill-card{
  background:#fff;border-radius:20px;padding:26px;
  box-shadow:0 8px 28px rgba(255,126,95,.12);transition:.3s;position:relative;overflow:hidden;
}
.skill-card::after{
  content:"";position:absolute;right:-30px;top:-30px;width:90px;height:90px;
  border-radius:50%;background:rgba(255,201,77,.18);
}
.skill-card:hover{transform:translateY(-6px)}
.skill-card .ico{font-size:1.8rem}
.skill-card h3{font-size:1.05rem;margin:8px 0}
.skill-card p{color:var(--sub);font-size:.92rem;margin-bottom:12px}
.tags{display:flex;gap:8px;flex-wrap:wrap}
.tag-chip{
  font-size:.78rem;padding:3px 12px;border-radius:999px;
  background:rgba(255,126,95,.12);color:var(--coral);font-weight:600;
}

/* 作品卡片 */
.work-card{
  position:relative;overflow:hidden;
  display:flex;gap:22px;background:#fff;border-radius:20px;
  padding:28px;margin-bottom:20px;box-shadow:0 8px 28px rgba(255,126,95,.12);
  transition:transform .3s, box-shadow .3s;align-items:flex-start;flex-wrap:wrap;
}
/* 悬停：白色线性渐变从板块中心快速蔓延覆盖 */
.work-card::before{
  content:"";position:absolute;inset:0;z-index:0;
  background:linear-gradient(120deg,#ffffff,#FFF3E8);
  clip-path:circle(0% at 50% 50%);
  transition:clip-path .38s ease;
}
.work-card:hover::before{clip-path:circle(150% at 50% 50%)}
.work-card>*{position:relative;z-index:1}
.work-card:hover{transform:translateY(-5px);box-shadow:0 16px 40px rgba(255,126,95,.22)}
/* 悬停时文字反色 */
.work-card:hover h3{color:var(--ink)}
.work-card:hover p{color:#6B5B4E}
.work-card:hover .tag-chip{background:rgba(255,126,95,.18);color:#E05A3A}
.work-card:hover .work-status.making{background:#E05A3A}
.work-card:hover .work-status.done{background:#5E9464}

/* 悬停时旋转弹出的预览图框（跟随鼠标） */
.work-float{
  position:fixed;z-index:150;width:230px;pointer-events:none;
  opacity:0;transform:scale(.5) rotate(-14deg);
}
.work-float.show{opacity:1;animation:floatPop .38s cubic-bezier(.2,.9,.3,1.35) forwards}
@keyframes floatPop{
  from{transform:scale(.5) rotate(-14deg)}
  to{transform:scale(1) rotate(4deg)}
}
.work-float .frame{
  width:100%;aspect-ratio:4/3;border-radius:16px;overflow:hidden;
  border:3px solid #fff;box-shadow:0 20px 45px rgba(0,0,0,.32);
  background:#3A3129;display:flex;align-items:center;justify-content:center;
}
.work-float .frame img{width:100%;height:100%;object-fit:cover;display:block}
.work-float .frame .ph{
  color:#FFDD8A;font-size:.78rem;font-weight:700;letter-spacing:.06em;text-align:center;padding:8px;
}
.work-float .cap{
  margin-top:8px;text-align:center;font-size:.72rem;font-weight:700;letter-spacing:.1em;
  color:#fff;text-shadow:0 1px 8px rgba(0,0,0,.45);text-transform:uppercase;
}
.work-badge{
  flex-shrink:0;width:64px;height:64px;border-radius:18px;
  display:flex;align-items:center;justify-content:center;font-size:1.8rem;
  background:linear-gradient(135deg,var(--peach),var(--yellow));
}
.work-card.making .work-badge{background:linear-gradient(135deg,var(--coral),var(--peach))}
.work-card h3{font-size:1.15rem;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.work-status{font-size:.72rem;font-weight:700;padding:2px 10px;border-radius:999px}
.work-status.making{background:var(--coral);color:#fff;animation:pulse 1.6s infinite}
.work-status.done{background:var(--green);color:#fff}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}
.work-card p{color:var(--sub);font-size:.94rem;margin-top:6px}

/* 荣誉时间线 */
.timeline{position:relative;padding-left:34px}
.timeline::before{
  content:"";position:absolute;left:10px;top:6px;bottom:6px;width:3px;
  background:linear-gradient(180deg,var(--coral),var(--yellow),var(--green));border-radius:3px;
}
.tl-item{position:relative;margin-bottom:26px}
.tl-item::before{
  content:"";position:absolute;left:-31px;top:8px;width:15px;height:15px;
  border-radius:50%;background:#fff;border:4px solid var(--coral);
}
.tl-item:nth-child(2)::before{border-color:var(--peach)}
.tl-item:nth-child(3)::before{border-color:var(--yellow)}
.tl-item:nth-child(4)::before{border-color:var(--green)}
.tl-item .year{font-size:.85rem;font-weight:700;color:var(--coral)}
.tl-item .title{font-size:1.02rem;font-weight:600}

/* 书单卡片 */
.books-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px}
.book-card{
  background:#fff;border-radius:20px;padding:24px;
  box-shadow:0 8px 28px rgba(255,126,95,.12);border-left:5px solid var(--yellow);transition:.3s;
}
.book-card:hover{transform:translateY(-5px) rotate(-1deg)}
.book-card h3{font-size:1.05rem;margin-bottom:6px}
.book-card p{color:var(--sub);font-size:.92rem;font-style:italic}

/* PPT 放映室卡片 */
.ppt-card{
  background:#fff;border-radius:20px;padding:26px;margin-bottom:24px;
  box-shadow:0 8px 28px rgba(255,126,95,.12);transition:.3s;
}
.ppt-card:hover{transform:translateY(-5px);box-shadow:0 16px 40px rgba(255,126,95,.22)}
.ppt-card h3{font-size:1.15rem}
.ppt-card .ppt-desc{color:var(--sub);font-size:.92rem;margin:6px 0 18px}
.ppt-slides{display:flex;gap:14px;flex-wrap:wrap}
.ppt-slides .slide{
  flex:1 1 260px;border-radius:12px;overflow:hidden;
  border:1px solid rgba(255,126,95,.2);box-shadow:0 6px 18px rgba(0,0,0,.1);
  transition:transform .3s;
}
.ppt-slides .slide:hover{transform:scale(1.03)}
.ppt-slides .slide img{width:100%;display:block}

/* 联系 */
.contact{
  text-align:center;padding:90px 6vw 110px;
  background:
    radial-gradient(circle at 20% 30%, rgba(255,126,95,.12), transparent 40%),
    radial-gradient(circle at 80% 70%, rgba(255,201,77,.15), transparent 40%);
}
.contact h2{font-size:1.9rem;margin-bottom:10px}
.contact .motto-big{
  font-size:clamp(1.4rem,3.5vw,2.1rem);font-weight:800;margin:18px 0 34px;
  background:linear-gradient(90deg,var(--coral),var(--yellow));
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.contact .ways{display:flex;gap:16px;justify-content:center;flex-wrap:wrap}
.contact .ways .btn.primary{background:var(--ink);color:#FFF3E4}
.contact .ways .btn.primary:hover{background:var(--coral)}
.contact .ways .btn.ghost{border-color:var(--ink);color:var(--ink)}
.contact .ways .btn.ghost:hover{background:var(--ink);color:#fff}

footer{text-align:center;padding:26px;color:var(--sub);font-size:.85rem}

/* ---------- 滚动渐入动画（降级：JS 运行时才加 .anim，脚本失败时元素默认完全不透明，绝不白屏） ---------- */
.anim{opacity:0;transform:translateY(34px)}
.anim.in{
  opacity:1;transform:none;
  transition:opacity .8s cubic-bezier(.2,.7,.3,1), transform .8s cubic-bezier(.2,.7,.3,1);
}
/* 同组卡片 / 步骤按顺序错峰（stagger） */
.anim.in{transition-delay:var(--d,0s)}

/* ---------- 彩带粒子画布 ---------- */
#confetti-canvas{position:fixed;inset:0;pointer-events:none;z-index:300}

/* ---------- 气泡反馈 ---------- */
#toast{
  position:fixed;left:50%;bottom:80px;transform:translateX(-50%) translateY(20px);
  background:rgba(61,50,41,.92);color:#FFF3E0;padding:10px 22px;border-radius:999px;
  font-size:.9rem;font-weight:600;opacity:0;pointer-events:none;z-index:310;
  transition:opacity .3s, transform .3s;white-space:nowrap;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media(max-width:640px){
  nav .links{gap:10px;font-size:.78rem}
  .hero{text-align:center;justify-content:center}
  .hero .cta{justify-content:center}
  .nav-grid{grid-template-columns:repeat(2,1fr)}
  .hero .info-card{max-width:100%}
}
</style>
</head>
<body>

<!-- 全局滚动进度条 -->
<div id="progress"></div>

<nav>
  <div class="logo">陈屹凌<span style="color:var(--ink)">.</span></div>
  <div class="links">
    <a href="#about">关于我</a>
    <a href="#aigc">AIGC 灵感库</a>
    <a href="#ppt">PPT 放映室</a>
    <a href="#bookmusic">风吟宇宙</a>
    <a href="#contact">联系我</a>
  </div>
</nav>

<!-- 首屏 -->
<header class="hero">
  <!-- 左侧个人信息卡 -->
  <div class="info-card">
    <div class="intro">
      <div class="name-row">
        <h1 id="name"></h1>
        <img class="avatar" id="avatar" alt="陈屹凌的头像">
      </div>
      <span class="tag" id="tagline"></span>
      <p class="sub" id="subtitle"></p>
      <div class="cta">
        <a class="btn primary" id="telBtn" href="#">📞 电话联系</a>
        <button class="btn ghost" id="copyBtn" type="button">✉️ 复制邮箱</button>
      </div>
      <!-- 打字机身份关键词（位于按钮下方，带金色「」框） -->
      <div class="typeline"><span id="typed"></span><span class="cursor"></span></div>
    </div>
  </div>
  <!-- 右侧网站列表卡片格 -->
  <div class="nav-grid" id="navGrid"></div>
</header>

<!-- 关于我 -->
<section id="about">
  <div class="sec-head"><span class="num">01</span><h2>关于我</h2><div class="line"></div></div>
  <div class="about-flow" id="aboutFlow"></div>
</section>

<!-- AIGC 灵感库 -->
<section id="aigc">
  <div class="sec-head"><span class="num">02</span><h2>✨ AIGC 灵感库</h2><div class="line"></div></div>
  <p style="color:var(--sub);margin-bottom:26px">我的 AI 作品都在这里——每做出一个新作品，都会第一时间更新。</p>
  <h3 style="font-size:1.05rem;margin:10px 0 18px">🎬 作品集</h3>
  <div id="worksList"></div>
</section>

<!-- PPT 放映室 -->
<section id="ppt">
  <div class="sec-head"><span class="num">03</span><h2>📽️ PPT 放映室</h2><div class="line"></div></div>

<script>
/* ================= 基础数据填充（全部文案来自 data.js，未改动） ================= */
const p = DATA.profile;
document.title = p.name + " · " + p.tagline;
document.getElementById("avatar").src = p.avatar;
document.getElementById("name").textContent = p.name;
document.getElementById("tagline").textContent = p.tagline;
document.getElementById("subtitle").textContent = p.subtitle;
document.getElementById("mottoBig").textContent = "「 " + p.motto + " 」";
const telHref = "tel:" + p.phone;
["telBtn","telBtn2"].forEach(id => document.getElementById(id).href = telHref);

/* 首屏网站列表卡片（点击跳转锚点） */
document.getElementById("navGrid").innerHTML = DATA.navCards.map(c => {
  const inner = `<span class="name">${c.name}</span><span class="en">${c.en}</span>`;
  return c.soon
    ? `<div class="nav-card soon">${inner}</div>`
    : `<a class="nav-card" href="${c.target}">${inner}</a>`;
}).join("");

/* 关于我：一条主线，五步阅读（数据全部来自 data.js 的 about） */
(function renderAbout(){
  const a = DATA.about;
  const flow = document.getElementById("aboutFlow");
  if (!a || !flow) return;
  flow.innerHTML = `
    <!-- STEP 1：观点大标题（全版唯一最大锚点） -->
    <div class="a-step" data-step="1">
      <h3 class="a-title">${a.title}</h3>
      <p class="a-subtitle">${a.subtitle}</p>
    </div>
    <!-- STEP 2：事实速览条 -->
    <div class="a-step" data-step="2">
      <div class="fact-strip">
        ${a.facts.map(f => `<div class="fact-item"><div class="label">${f.label}</div><div class="value">${f.value}</div></div>`).join("")}
      </div>
    </div>
    <!-- STEP 3：成长路径（探索问题 → AI辅助开发 → 产品交付） -->
    <div class="a-step" data-step="3">
      <div class="path-row">
        ${a.path.map((n, i) => `
          ${i > 0 ? '<div class="path-arrow">→</div>' : ''}
          <div class="path-node"><h4>${n.title}</h4><p>${n.desc}</p></div>
        `).join("")}
      </div>
    </div>
    <!-- STEP 4：做事方式标签 -->
    <div class="a-step" data-step="4">
      <div class="style-tags">${a.tags.map(t => `<span class="style-chip">${t}</span>`).join("")}</div>
    </div>
    <!-- STEP 5：格言收尾 -->
    <div class="a-step" data-step="5">
      <div class="a-quote">${a.quote}</div>
    </div>`;
})();
document.getElementById("worksList").innerHTML = DATA.works.map(w => {
  const badge = w.status === "making" ? "🎬" : "✨";
  const statusHtml = w.status === "making"
    ? '<span class="work-status making">制作中</span>'
    : '<span class="work-status done">已上线</span>';
  const link = w.link ? `<a class="btn ghost" style="margin-top:10px;padding:7px 20px;font-size:.85rem;border-color:var(--ink);color:var(--ink)" href="${w.link}" target="_blank">查看作品 →</a>` : "";
  // data-img 用于悬停弹出的预览图
  return `<div class="work-card ${w.status}" data-img="${w.img || ""}">
    <div class="work-badge">${badge}</div>
    <div style="flex:1;min-width:220px">
      <h3>${w.title} ${statusHtml}</h3>
      <p>${w.desc}</p>
      <div class="tags" style="margin-top:10px">${w.tags.map(t=>`<span class="tag-chip">${t}</span>`).join("")}</div>
      ${link}
    </div></div>`;
}).join("");
document.getElementById("timeline").innerHTML = DATA.honors.map(h =>  `<div class="tl-item"><div class="year">${h.year}</div><div class="title">${h.title}</div></div>`).join("");
document.getElementById("booksGrid").innerHTML = DATA.books.map(b =>
  `<div class="book-card"><h3>📖 ${b.title}</h3><p>${b.note}</p></div>`).join("");
/* PPT 放映室：以图片形式展示幻灯片 */
document.getElementById("pptList").innerHTML = (DATA.ppt || []).map(p =>
  `<div class="ppt-card">
     <h3>📽️ ${p.title}</h3>
     <p class="ppt-desc">${p.desc}</p>
     <div class="ppt-slides">${p.slides.map(s => `<div class="slide"><img src="${s}" alt="${p.title} 幻灯片" loading="lazy"></div>`).join("")}</div>
   </div>`).join("");

/* ================= 1. 全局滚动进度条（cyan → emerald 渐变） ================= */
const progressEl = document.getElementById("progress");
function updateProgress(){
  const h = document.documentElement;
  const max = h.scrollHeight - h.clientHeight;
  progressEl.style.width = (max > 0 ? (h.scrollTop / max) * 100 : 0) + "%";
}
window.addEventListener("scroll", updateProgress, { passive: true });
updateProgress();

/* ================= 2. 打字机叙事（纯原生 JS，呼吸光标见 CSS） ================= */
(function typewriter(){
  const words = DATA.keywords || [];
  const el = document.getElementById("typed");
  if (!words.length || !el) return;
  let wi = 0, ci = 0, deleting = false;
  function tick(){
    const word = words[wi % words.length];
    if (!deleting) {
      ci++;
      el.textContent = word.slice(0, ci);
      if (ci === word.length) { deleting = true; return setTimeout(tick, 1800); } // 停留 1.8s
      setTimeout(tick, 110);
    } else {
      ci--;
      el.textContent = word.slice(0, ci);
      if (ci === 0) { deleting = false; wi++; return setTimeout(tick, 400); }
      setTimeout(tick, 55);
    }
  }
  tick();
})();

/* ================= 3. 金句轮播（元素已移除，保留空实现防报错） ================= */
(function quotes(){
  const qs = DATA.quotes || [];
  const el = document.getElementById("quote");
  if (!qs.length || !el) return;
  let i = 0;
  el.textContent = qs[0];
  setInterval(() => { i = (i + 1) % qs.length; el.textContent = qs[i]; }, 4000);
})();

/* ================= 4. 滚动渐入（IntersectionObserver + stagger，含降级） ================= */
/* 降级方案：只有 JS 执行到这里才会加 .anim；脚本失败时元素保持默认 opacity:1，绝不白屏 */
(function reveal(){
  // 同组（stagger 容器）内的卡片设置错峰延迟
  document.querySelectorAll(".stagger").forEach(group => {
    Array.from(group.children).forEach((child, i) => {
      child.style.setProperty("--d", (i * 0.12) + "s");
      child.classList.add("anim");
    });
  });
  // 关于我：5 个步骤依次出现（间隔 0.28s）
  document.querySelectorAll(".a-step").forEach((el, i) => {
    el.style.setProperty("--d", (i * 0.28) + "s");
    el.classList.add("anim");
  });
  // 各区块标题、作品卡片也加入渐入
  document.querySelectorAll(".sec-head, .work-card").forEach(el => el.classList.add("anim"));

  const io = new IntersectionObserver(entries => {
    entries.forEach(e => {
      if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); }
    });
  }, { threshold: 0.12, rootMargin: "0px 0px -40px 0px" });
  document.querySelectorAll(".anim").forEach(el => io.observe(el));
})();

/* ================= 4.5 关于我主轴「生长」动画（滚动驱动 + 平滑插值） ================= */
(function growSpine(){
  const flow = document.getElementById("aboutFlow");
  if (!flow) return;
  let target = 1, current = 1, raf = null;

  function computeTarget(){
    const rect = flow.getBoundingClientRect();
    const vh = window.innerHeight;
    // 进度：主轴顶部进入视口 85% 位置开始生长，滑过 45% 视口后长满
    const raw = (vh * 0.85 - rect.top) / (vh * 0.45);
    target = Math.min(1, Math.max(0.02, raw));
    if (!raf) raf = requestAnimationFrame(step);
  }
  function step(){
    // 每帧向目标值靠近 8%，形成“缓缓展开”的阻尼感
    current += (target - current) * 0.08;
    flow.style.setProperty("--grow", current.toFixed(4));
    if (Math.abs(target - current) > 0.001) {
      raf = requestAnimationFrame(step);
    } else {
      flow.style.setProperty("--grow", target.toFixed(4));
      raf = null;
    }
  }
  window.addEventListener("scroll", computeTarget, { passive: true });
  window.addEventListener("resize", computeTarget);
  computeTarget();
})();

/* ================= 5. 彩带粒子（原生 Canvas 实现，60fps，只动合成层不重排） ================= */
const cvs = document.getElementById("confetti-canvas");
const ctx = cvs.getContext("2d");
let particles = [];
let rafId = null;

function resizeCanvas(){
  const dpr = Math.min(window.devicePixelRatio || 1, 2); // 限制 DPR 保证帧率
  cvs.width = innerWidth * dpr;
  cvs.height = innerHeight * dpr;
  cvs.style.width = innerWidth + "px";
  cvs.style.height = innerHeight + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
resizeCanvas();
window.addEventListener("resize", resizeCanvas);

const CONFETTI_COLORS = ["#FF7E5F","#FFB88C","#FFC94D","#7FB685","#22d3ee","#FFDD8A"];
function burst(x, y, count){
  for (let i = 0; i < count; i++){
    const angle = Math.random() * Math.PI * 2;
    const speed = 4 + Math.random() * 7;
    particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed - 3,
      w: 5 + Math.random() * 6,
      h: 8 + Math.random() * 8,
      color: CONFETTI_COLORS[(Math.random() * CONFETTI_COLORS.length) | 0],
      rot: Math.random() * Math.PI,
      vr: (Math.random() - .5) * .3,
      life: 1
    });
  }
  if (!rafId) rafId = requestAnimationFrame(draw);
}
function draw(){
  ctx.clearRect(0, 0, innerWidth, innerHeight);
  particles = particles.filter(pt => pt.life > 0);
  for (const pt of particles){
    pt.vy += 0.22;            // 重力
    pt.vx *= 0.99;            // 空气阻力
    pt.x += pt.vx; pt.y += pt.vy;
    pt.rot += pt.vr;
    pt.life -= 0.012;
    ctx.save();
    ctx.translate(pt.x, pt.y);
    ctx.rotate(pt.rot);
    ctx.globalAlpha = Math.max(pt.life, 0);
    ctx.fillStyle = pt.color;
    // 高度随旋转变化，模拟纸屑翻转
    ctx.fillRect(-pt.w / 2, -pt.h / 2, pt.w, pt.h * Math.abs(Math.sin(pt.rot * 2)) + 2);
    ctx.restore();
  }
  rafId = particles.length ? requestAnimationFrame(draw) : null;
}

/* ================= 7.5 作品卡片悬停特效：白色蔓延 + 鼠标处旋转弹出预览图 ================= */
(function workHover(){
  // 创建悬浮图框（一个共用，跟随鼠标移动）
  const float = document.createElement("div");
  float.className = "work-float";
  float.innerHTML = `
    <div class="frame">
      <img alt="">
      <div class="ph"></div>
    </div>
    <div class="cap"></div>`;
  document.body.appendChild(float);
  const img = float.querySelector("img");
  const ph  = float.querySelector(".ph");
  const cap = float.querySelector(".cap");
  // 图片加载失败时显示空画框占位（提示文件名）
  img.addEventListener("error", () => { img.style.display = "none"; });
  img.addEventListener("load",  () => { img.style.display = "block"; ph.style.display = "none"; });

  let visible = false;

  function showFloat(card, evt){
    const src = card.getAttribute("data-img") || "";
    const fileName = src.split("/").pop() || "AI1.png";
    if (img.getAttribute("src") !== src) {
      img.setAttribute("src", src);
      ph.style.display = "block";
      ph.textContent = fileName + "（待放入 assets 文件夹）";
    }
    cap.textContent = fileName;
    moveFloat(evt);
    if (!visible) { float.classList.add("show"); visible = true; }
  }
  function moveFloat(evt){
    const w = 230, h = 200; // 图框估算尺寸
    let x = evt.clientX + 26;
    let y = evt.clientY - h / 2;
    // 防止超出视口
    if (x + w > innerWidth - 12)  x = evt.clientX - w - 26;
    if (y < 12)  y = 12;
    if (y + h > innerHeight - 12) y = innerHeight - h - 12;
    float.style.left = x + "px";
    float.style.top  = y + "px";
  }
  function hideFloat(){
    float.classList.remove("show");
    visible = false;
  }

  document.querySelectorAll(".work-card").forEach(card => {
    card.addEventListener("mouseenter", evt => showFloat(card, evt));
    card.addEventListener("mousemove",  evt => moveFloat(evt));
    card.addEventListener("mouseleave", hideFloat);
  });
})();

/* ================= 6. 气泡反馈 ================= */
const toastEl = document.getElementById("toast");
let toastTimer = null;
function toast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove("show"), 1800);
}

/* ================= 7. 按钮交互：复制邮箱 / 打招呼 → 彩带 + 气泡 ================= */
function fireAt(el, evt){
  const rect = el.getBoundingClientRect();
  const x = evt && evt.clientX ? evt.clientX : rect.left + rect.width / 2;
  const y = evt && evt.clientY ? evt.clientY : rect.top + rect.height / 2;
  burst(x, y, 70);
}
["copyBtn","copyBtn2"].forEach(id => {
  const btn = document.getElementById(id);
  if (!btn) return;
  btn.addEventListener("click", evt => {
    fireAt(btn, evt);
    // 复制邮箱到剪贴板（带 execCommand 降级）
    const done = () => toast("📋 邮箱已复制：" + p.email);
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(p.email).then(done).catch(done);
    } else {
      const ta = document.createElement("textarea");
      ta.value = p.email; document.body.appendChild(ta);
      ta.select(); try { document.execCommand("copy"); } catch(e){}
      document.body.removeChild(ta); done();
    }
  });
});
const hiBtn = document.getElementById("hiBtn");
if (hiBtn) hiBtn.addEventListener("click", evt => {
  fireAt(hiBtn, evt);
  toast("👋 你好呀！很高兴认识你，欢迎常来看看～");
});
</script>
